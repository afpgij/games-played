[project]
name = "games-played-backend"
version = "0.1.0"
description = "FastAPI backend for games-played"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
