# /etc/nginx/sites-available/games.tudominio.com
# ln -s /etc/nginx/sites-available/games.tudominio.com /etc/nginx/sites-enabled/
# certbot --nginx -d games.tudominio.com

server {
    listen 80;
    listen [::]:80;
    server_name games.tudominio.com;

    # Certbot rellenara aqui las directivas SSL al ejecutar:
    # certbot --nginx -d games.tudominio.com
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name games.tudominio.com;

    # ssl_certificate     /etc/letsencrypt/live/games.tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/games.tudominio.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    # API FastAPI (puerto 8002, solo localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # Frontend Next.js (puerto 3002, solo localhost)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
